<script>
'use strict';
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(x,z,a,b)=>Math.hypot(x-a,z-b);
const QUESTS=[
{chapter:1,id:'overlook',name:'Look out at Whoville',x:-20,z:-11,verb:'Look',speech:'The town below is getting ready for Christmas. The Grinch decides to stop their celebration.'},
{chapter:1,id:'desk',name:'Make a plan at the desk',x:-12,z:2,verb:'Plan',speech:'A Santa disguise, an empty sack and a sleigh. The Grinch has a plan.'},
{chapter:2,id:'cloth',name:'Find red fabric in the storage alcove',x:-1,z:-10,verb:'Take',speech:'Red fabric will make a convincing coat.'},
{chapter:2,id:'sew',name:'Make the Santa coat at the sewing table',x:5,z:-7,verb:'Sew',speech:'The coat is finished!'},
{chapter:2,id:'hat',name:'Pick up the Santa hat',x:8,z:-12,verb:'Wear',speech:'The disguise is coming together.'},
{chapter:2,id:'sack',name:'Collect an empty sack',x:8,z:4,verb:'Take',speech:'The sack is ready for the journey.'},
{chapter:3,id:'antler',name:'Find an antler in the stable',x:17,z:-11,verb:'Take',speech:'Now Max can look like a reindeer.'},
{chapter:3,id:'max',name:'Fit the antler and harness on Max',x:20,z:-4,verb:'Harness',speech:'Max is ready. Lead him to the sleigh!'},
{chapter:3,id:'sleigh',name:'Bring Max to the sleigh garage',x:22,z:7,verb:'Attach',speech:'The sleigh is ready to go. Head out onto the mountain trail.'},
{chapter:3,id:'trail',name:'Reach the snowy mountain trail',x:24,z:16,verb:'Depart',speech:'Whoville waits below. Your journey is about to begin.'}
];
const bounds={xmin:-25,xmax:28,zmin:-15,zmax:19};
const obstacles=[
[-24,-24,-15,12], // west edge
[-25,10,-15,-14],[13,27,-15,-14],
[-25,-18,-5,-4],[-13,-5,-5,-4],[0,12,-5,-4],
[12,13,-14,-9],[12,13,-4,1],[12,13,6,12],
[-17,-13,6,9],[-11,-7,4,6],[-22,-18,-9,-7],
[-3,1,-13,-11],[4,7,-10,-8],[7,10,-14,-13],
[17,21,-13,-12],[15,17,0,3],[23,26,8,11]
];
function blocked(x,z,r=.44){if(x<bounds.xmin+r||x>bounds.xmax-r||z<bounds.zmin+r||z>bounds.zmax-r)return true;return obstacles.some(([a,b,c,d])=>x>a-r&&x<b+r&&z>c-r&&z<d+r)}
function pathTo(sx,sz,tx,tz){const step=.75,nx=Math.floor((bounds.xmax-bounds.xmin)/step)+1,nz=Math.floor((bounds.zmax-bounds.zmin)/step)+1,coord=i=>[bounds.xmin+(i%nx)*step,bounds.zmin+Math.floor(i/nx)*step],idx=(x,z)=>z*nx+x,snap=(x,z)=>idx(clamp(Math.round((x-bounds.xmin)/step),0,nx-1),clamp(Math.round((z-bounds.zmin)/step),0,nz-1));let start=snap(sx,sz),q=[start],prev=new Map([[start,-1]]),best=start,bd=Infinity;for(let k=0;k<q.length;k++){let i=q[k],p=coord(i),d=dist(p[0],p[1],tx,tz);if(d<bd){bd=d;best=i}if(d<.5)break;for(let [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=i%nx+dx,z=Math.floor(i/nx)+dz;if(x<0||x>=nx||z<0||z>=nz)continue;let j=idx(x,z),p=coord(j);if(prev.has(j)||blocked(...p))continue;prev.set(j,i);q.push(j)}}let out=[];for(let i=best;i!==start&&i!==-1;i=prev.get(i))out.unshift(coord(i));if(!blocked(tx,tz)&&bd<1.2)out.push([tx,tz]);return out}
function blankState(){return {step:0,x:-18,z:5,grade:2,secrets:[],done:false}}
function readSave(){try{let s=JSON.parse(localStorage.getItem('crumpit3d-v1'));return s&&Number.isInteger(s.step)&&s.step>=0&&s.step<=QUESTS.length?Object.assign(blankState(),s):null}catch(e){return null}}
let state=blankState(),quality='balanced',sound=false,paused=true,ready=false,route=[],autoAct=false,jumpY=0,jumpV=0,actionHold=0,dialogTimer=0,keys={},joy={x:0,z:0};
let T,renderer,scene,camera,player,maxDog,marker,snow,fire,clock=0,last=0,lookX=-18,lookZ=5,camX=-18,camZ=5,objects={},mapCtx=$('map').getContext('2d'),audioCtx=null;
let materials={},fireParts=[],twinkles=[],maxPos={x:20,z:-4},moving=false,playerAngle=0,stepClock=0;
const seeded=n=>{let f=Math.sin(n*127.1+311.7)*43758.5453;return f-Math.floor(f)};
const storage=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function save(){storage('crumpit3d-v1',state)}
function say(who,text,secs=4.5){$('speaker').textContent=who;$('speech').textContent=text;$('dialog').classList.add('show');dialogTimer=secs;if(sound&&'speechSynthesis'in window){try{let u=new SpeechSynthesisUtterance(text);u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}}
function chime(){if(!sound)return;try{audioCtx||=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();for(let [i,f] of [523.25,659.25,783.99].entries()){let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.09;o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.31)}}catch(e){}}
function current(){return QUESTS[state.step]}
function updateHUD(){let q=current();$('chapter').textContent=q?'Chapter '+q.chapter+' • '+['','Mount Crumpit','Santa disguise','Max & the sleigh'][q.chapter]:'Opening adventure complete';$('goal').textContent=q?q.name:'Ready for Whoville';$('bar').style.width=(100*state.step/QUESTS.length)+'%';$('action').textContent=q?q.verb:'Done';$('action').classList.toggle('ready',!!q&&dist(state.x,state.z,q.x,q.z)<2.5);$('call').style.display=state.step>=8?'inline-block':'none';$('hint').textContent=actionHold>0?'Working…':state.grade<2?'Tap the golden marker to walk and interact':'Arrows / joystick • E interact • Space jump';$('inventory').innerHTML='Inventory<br>'+['Red fabric','Santa coat','Santa hat','Sack','Antler','Max ready','Sleigh ready'].filter((_,i)=>state.step>=i+3).map(t=>'✓ '+t).join('<br>')+(state.step<3?'Empty':'')+'<br>★ '+state.secrets.length+' hidden stars'}
function advance(){let q=current();if(!q)return;state.step++;state.done=state.step>=QUESTS.length;route=[];autoAct=false;actionHold=0;chime();say(q.id==='max'?'Max':q.id==='overlook'?'Narrator':'Grinch',q.speech);applyProgress();save();updateHUD();if(state.done){endWait=2.5}}
let endWait=0;
function action(){if(paused||!ready||actionHold>0||state.done)return;let q=current();if(!q)return;if(dist(state.x,state.z,q.x,q.z)>2.5){go(q.x,q.z,true);return}if(q.id==='sew'||q.id==='max'||q.id==='sleigh'){actionHold=q.id==='sew'?2.5:1.5;say('Grinch',q.id==='sew'?'Stitching the coat…':q.id==='max'?'Adjusting Max’s harness…':'Securing the sleigh…',2.3)}else advance()}
function go(x,z,act=false){route=pathTo(state.x,state.z,x,z);autoAct=act;if(!route.length&&act&&dist(state.x,state.z,x,z)<2.5)action()}
function jump(){if(!paused&&jumpY<.001){jumpV=6.5;jumpY=.01}}
function callMax(){if(state.step<8||paused)return;maxPos.x=state.x-1.5;maxPos.z=state.z+1;say('Max','Woof! Ready to help.',2);chime()}
function menu(startup=false){paused=true;keys={};joy={x:0,z:0};$('overlay').classList.remove('hidden');const s=readSave();$('panel').innerHTML='<div class="eyebrow">Gilbert Elementary • 3D development preview</div><h1>Operation Save Christmas</h1><h2>Mount Crumpit</h2><p>Explore the Grinch’s cave, assemble his Santa disguise, prepare Max and reach the mountain trail in a continuous 3D environment.</p><div class="row"><label>Grade<select id="grade">'+['Pre-K','Kindergarten','1st','2nd','3rd','4th','5th'].map((g,i)=>'<option value="'+i+'" '+(state.grade===i?'selected':'')+'>'+g+'</option>').join('')+'</select></label><label>Graphics<select id="quality"><option value="performance">Performance</option><option value="balanced">Balanced</option><option value="cinematic">Cinematic</option></select></label></div><div class="row"><button class="primary" id="start">'+(startup?'Start new adventure':'Resume')+'</button>'+(startup&&s&&!s.done?'<button id="continue">Continue saved adventure</button>':'')+'<button id="restart">Restart</button></div><p class="small">Keyboard: WASD / arrows, E, space. Touch: joystick, action or tap a destination. Original procedural 3D art. Unofficial book companion. This preview contains the opening three chapters; the full story is still in Version 8.</p><a href="index.html">← Full Version 8 game</a>';
$('quality').value=quality;$('quality').onchange=()=>setQuality($('quality').value);$('start').onclick=()=>{let g=+$('grade').value;if(startup)reset(g);else state.grade=g;play()};if(startup&&s&&!s.done)$('continue').onclick=()=>{state=s;resetPosition();applyProgress();play()};$('restart').onclick=()=>{reset(+$('grade').value);play()}}
function play(){paused=false;last=0;$('overlay').classList.add('hidden');updateHUD();say('Narrator',state.step===0?'Christmas Eve, high above Whoville. Explore the Grinch’s mountain home.':current()?.name||'Adventure complete.',4)}
function reset(g){state=blankState();state.grade=g;resetPosition();applyProgress();save()}
function resetPosition(){route=[];autoAct=false;jumpY=jumpV=actionHold=0;endWait=0;lookX=camX=state.x;lookZ=camZ=state.z;maxPos={x:20,z:-4};if(blocked(state.x,state.z)){state.x=-18;state.z=5;lookX=camX=state.x;lookZ=camZ=state.z}}
function ending(){paused=true;$('overlay').classList.remove('hidden');$('panel').innerHTML='<div class="eyebrow">Opening adventure complete</div><h1>Ready for Whoville!</h1><p>You made the Santa disguise, prepared Max and reached the mountain trail. The next stage is the journey to the town.</p><p class="badge">★ Hidden stars: '+state.secrets.length+' / 3</p><div class="row"><button class="primary" id="again">Explore again</button><a href="index.html"><button>Play the complete Version 8 story</button></a></div><p class="small">Version 9 progress is saved separately from Version 8. This is a playable 3D opening-area prototype, not a replacement for the complete story.</p>';$('again').onclick=()=>{reset(state.grade);play()}}
function mat(color,rough=.85,emissive=null){let key=color+'/'+rough+'/'+emissive;if(!materials[key])materials[key]=new T.MeshStandardMaterial({color,roughness:rough,emissive:emissive||0x000000,emissiveIntensity:emissive?.55:0});return materials[key]}
function mesh(g,m,parent,x=0,y=0,z=0){let o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function box(parent,x,y,z,w,h,d,c,rough=.85){return mesh(new T.BoxGeometry(w,h,d),mat(c,rough),parent,x,y,z)}
function sphere(parent,x,y,z,sx,sy,sz,c){let o=mesh(new T.SphereGeometry(1,16,10),mat(c),parent,x,y,z);o.scale.set(sx,sy,sz);return o}
function cylinder(parent,x,y,z,r1,r2,h,c,n=12){return mesh(new T.CylinderGeometry(r1,r2,h,n),mat(c),parent,x,y,z)}
function group(parent,x=0,y=0,z=0){let g=new T.Group();g.position.set(x,y,z);parent.add(g);return g}
function beam(parent,a,b,r,c){let v=new T.Vector3(b[0]-a[0],b[1]-a[1],b[2]-a[2]),o=cylinder(parent,(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2,r,r,v.length(),c,8);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize());return o}
function rock(parent,x,y,z,w,h,d,c){let o=mesh(new T.DodecahedronGeometry(1,0),mat(c),parent,x,y,z);o.scale.set(w,h,d);o.rotation.y=seeded(x+z)*6;return o}
function rug(x,z,w,d,c){box(scene,x,.03,z,w,.05,d,c);for(let i=0;i<4;i++){box(scene,x-w/2+.18+i*.1,.065,z,.055,.02,d-.15,0xd7b485);box(scene,x+w/2-.18-i*.1,.065,z,.055,.02,d-.15,0xd7b485)}}
function tree(x,z,s=1){let p=group(scene,x,0,z);cylinder(p,0,.6*s,0,.18*s,.25*s,1.2*s,0x765547);for(let i=0;i<3;i++){let r=(1.5-i*.28)*s,y=(1.3+i*.85)*s;cylinder(p,0,y,0,0,r,2.1*s,0x32665c,10);cylinder(p,0,y+.25*s,0,0,r*.85,1.65*s,0xe2f1f5,10)}return p}
function present(parent,x,y,z,s,c){box(parent,x,y,z,s,s,s,c);box(parent,x,y+s*.51,z,s*1.06,.09*s,s*1.06,c);box(parent,x,y,z,s*.19,s*1.05,s*1.01,0xe9c16b);box(parent,x,y,z,s*1.01,s*1.05,s*.19,0xe9c16b)}
function table(x,z,w,d){let g=group(scene,x,0,z);box(g,0,1.2,0,w,.22,d,0x886247);for(let a of [-1,1])for(let b of [-1,1])box(g,a*(w/2-.25),.6,b*(d/2-.25),.19,1.2,.19,0x634b40);return g}
function shelf(x,z){let g=group(scene,x,0,z);box(g,0,1.5,-.2,3,.12,1,0x705047);box(g,0,2.65,-.2,3,.12,1,0x705047);box(g,0,.3,-.2,3,.12,1,0x705047);for(let side of [-1,1])box(g,side*1.45,1.5,-.2,.14,3,1,0x75574a);for(let i=0;i<7;i++)box(g,-1.1+i*.35,1.86,-.1,.25,.65,.5,[0xa86b6d,0xb9a06a,0x719c91][i%3]);return g}
function lamp(x,z){let g=group(scene,x,0,z);cylinder(g,0,.2,0,.32,.4,.4,0x655044);cylinder(g,0,1.2,0,.07,.09,2,0x9b7a50);cylinder(g,0,2.3,0,.28,.53,.6,0xd8b87d);sphere(g,0,2.25,0,.3,.3,.3,0xffdf91);return g}
