<script>

const $=id=>document.getElementById(id), cv=$('world'), ctx=cv.getContext('2d'), TAU=Math.PI*2;
const grades=['Pre-K','K','1st','2nd','3rd','4th','5th'];const modes=[['quick','Quick Play','10-minute rotating missions'],['story','Story Adventure','Journey from mischief to kindness'],['explore','Explore Whoville','Discover secrets at your own pace'],['race','Sleigh Racing','Race through snowy checkpoints'],['workshop','Christmas Workshop','Toy and pattern challenges']];
let grade=2,mode='quick',character='grinch',prefs={minutes:10,music:false,effects:false,voice:false,assist:true,reset:true},best=0,save=null;try{Object.assign(prefs,JSON.parse(localStorage.getItem('grinch-prefs')||'{}'));best=+localStorage.getItem('grinch-best')||0;save=JSON.parse(localStorage.getItem('grinch-save')||'null')}catch(e){}
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};let state='menu',W=0,H=0,DPR=1,now=0,prev=0,zoom=1,cam={x:0,y:0},keys={},joy={x:0,y:0},lastToast=0,audio=null,musicTimer=null,musicIdx=0;

const player={x:0,y:100,z:0,vz:0,dir:1,moving:false};let session={score:0,hearts:0,seconds:0,missions:0,index:0},mission=null,items=[],particles=[],guards=[],racePath=[],lastSpot=0,puzzle=null;
const homes=[[-420,-110,'#d65f61'],[-230,-160,'#c19a4e'],[210,-155,'#5b9aa2'],[425,-95,'#9875b4'],[-430,135,'#71975e'],[-220,190,'#b86b48'],[220,180,'#b16b83'],[430,130,'#568fa5'],[-330,380,'#8c78b8'],[330,380,'#d27b59']].map((h,i)=>({x:h[0],y:h[1],color:h[2],name:['Peppermint','Gingerbread','Snowflake','Twinkle','Holly','Cocoa','Jingle','Frost','Candy','Star'][i],id:i}));
const trees=[];for(let i=0;i<65;i++){let a=i*2.399,x=Math.cos(a)*(570+(i%5)*36),y=Math.sin(a)*(470+(i%7)*26);if(y< -420&&Math.abs(x)<250)continue;trees.push({x,y,h:45+(i*17)%55})}const snow=Array.from({length:95},()=>({x:Math.random(),y:Math.random(),r:rnd(.7,2.1),v:rnd(.035,.13)}));
const story=[['supplies','Inside Mount Crumpit'],['workshop','Build the Sleigh'],['race','Mountain Madness'],['collect','Welcome to Whoville'],['stealth','Silent Night'],['stealth','The Christmas Mischief'],['race','Runaway Sleigh'],['rescue','Trouble on Mount Crumpit'],['kindness','Three Sizes Bigger'],['deliver','Operation Save Christmas'],['decorate','Christmas Celebration'],['kindness','The Christmas Feast']];const quick=['collect','deliver','race','kindness','rescue','decorate','stealth','workshop'];let quickOrder=[];
function settingsHTML(){return `<div class="setting"><span>Library session length</span><select id="mins">${[5,10,15,20,30,0].map(n=>`<option value="${n}" ${prefs.minutes===n?'selected':''}>${n?n+' minutes':'Unlimited'}</option>`).join('')}</select></div>${[['music','Original background music'],['effects','Sound effects'],['voice','Spoken instructions'],['assist','Navigation assistance'],['reset','Return to menu after quick play']].map(([k,l])=>`<label class="setting">${l}<input type="checkbox" id="pref-${k}" ${prefs[k]?'checked':''}></label>`).join('')}`}

function portrait(v){let green=v==='grinch',dog=v==='max';return '<svg viewBox="0 0 80 80" aria-hidden="true"><defs><radialGradient id="face-'+v+'"><stop stop-color="'+(green?'#d3ef92':dog?'#efc38b':'#ffe5bf')+'"/><stop offset="1" stop-color="'+(green?'#74b657':dog?'#a77150':'#e6a087')+'"/></radialGradient></defs><circle cx="40" cy="40" r="38" fill="#173447" stroke="#d5c590"/>'+(dog?'<path d="M35 26V12L23 5M35 14L46 6" fill="none" stroke="#d7b77f" stroke-width="4" stroke-linecap="round"/><ellipse cx="22" cy="41" rx="11" ry="19" fill="#885b45"/><ellipse cx="58" cy="41" rx="11" ry="19" fill="#885b45"/><ellipse cx="40" cy="41" rx="23" ry="25" fill="url(#face-max)"/><ellipse cx="40" cy="52" rx="17" ry="12" fill="#f6d6a6"/><ellipse cx="40" cy="47" rx="8" ry="5" fill="#302d34"/>':(green?'<path d="M17 29L17 15L27 21L35 8L42 20L55 12L61 28Q76 47 59 62Q40 79 20 62Q5 48 17 29Z" fill="url(#face-grinch)"/>':'<ellipse cx="40" cy="39" rx="29" ry="32" fill="#d6a34f"/><ellipse cx="40" cy="43" rx="23" ry="26" fill="url(#face-cindy)"/><path d="M16 25Q33 4 55 20L65 33Q48 22 36 29Q26 25 16 30Z" fill="#f5ce78"/><path d="M40 15L22 6L23 24L40 18L58 7L58 24Z" fill="#d85976"/>'))+'<g fill="#fff5da"><ellipse cx="31" cy="37" rx="7" ry="9"/><ellipse cx="49" cy="37" rx="7" ry="9"/></g><g fill="#304047"><ellipse cx="32" cy="38" rx="3" ry="5"/><ellipse cx="50" cy="38" rx="3" ry="5"/></g>'+(green?'<path d="M23 29L34 32M57 29L46 32" stroke="#355e3b" stroke-width="4" stroke-linecap="round"/>':'')+'<path d="M29 54Q40 63 52 53" stroke="#714b4d" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M25 69Q40 78 55 69" stroke="#e15c67" stroke-width="7" fill="none"/></svg>'}
function menu(){state='menu';stopMusic();$('hud').classList.remove('show');$('overlay').classList.remove('hide');$('panel').innerHTML=`<div class="eyebrow">Gilbert Elementary • Media Center</div><h1 class="title">THE GRINCH</h1><div class="subtitle">Operation Save Christmas</div><p class="lead">Explore snowy Whoville, race a runaway sleigh, rescue presents and discover the power of a generous heart.</p><div class="label">Choose your grade</div><div class="choice">${grades.map((g,i)=>`<button data-grade="${i}" class="${grade===i?'selected':''}">${g}</button>`).join('')}</div><div class="label">Choose your adventure</div><div class="modes">${modes.map(([v,t,d])=>`<button data-mode="${v}" class="${mode===v?'selected':''}">${t}<small>${d}</small></button>`).join('')}</div><div class="label">Choose your character</div><div class="choice">${[['grinch','Grinch'],['max','Max'],['cindy','Cindy Lou']].map(([v,t])=>`<button data-char="${v}" class="${character===v?'selected':''}">${portrait(v)}${t}</button>`).join('')}</div><div class="footer"><button class="primary" id="play">Start adventure ▶</button>${save?'<button id="resumeStory">Continue story</button>':''}<button id="teacher">⚙ Teacher settings</button><button id="full">⛶ Full screen</button></div><p class="note">No account needed • Best score: ${best} • Unofficial book companion with original vector artwork and synthesized audio. Not affiliated with the rights holders. For classroom evaluation; obtain appropriate permissions before public distribution.</p>`;
$('panel').querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{grade=+b.dataset.grade;menu()});$('panel').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;menu()});$('panel').querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{character=b.dataset.char;menu()});$('play').onclick=()=>start(false);if($('resumeStory'))$('resumeStory').onclick=()=>start(true);$('teacher').onclick=()=>settings(false);$('full').onclick=full;}
function settings(inGame){state=inGame?'pause':'settings';stopMusic();$('overlay').classList.remove('hide');$('panel').innerHTML=`<div class="eyebrow">Media center controls</div><h2 class="big">Teacher settings</h2>${settingsHTML()}<p class="note">Settings are stored only on this device. Sound is off by default for quiet library play. Younger players receive extra visual guidance.</p><div class="footer"><button class="primary" id="apply">Save settings</button><button id="back">Back</button></div>`;$('apply').onclick=()=>{prefs.minutes=+$('mins').value;for(let k of ['music','effects','voice','assist','reset'])prefs[k]=$('pref-'+k).checked;store('grinch-prefs',prefs);inGame?pause():menu()};$('back').onclick=()=>inGame?pause():menu()}
function full(){let el=document.documentElement;try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});else toast('On iPad, use Safari Add to Home Screen for a larger view.')}catch(e){}}
function tone(f,d=.12,vol=.045,type='sine'){if(!audio)return;try{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d)}catch(e){}}

function start(continuing){unlockAudio();quickOrder=quick.filter(t=>grade>1||t!=='stealth').sort(()=>Math.random()-.5);session={score:0,hearts:0,seconds:0,missions:0,index:0};if(continuing&&save){mode='story';grade=save.grade;character=save.character;session={...session,...save.session};}state='play';$('overlay').classList.add('hide');$('hud').classList.add('show');startMusic();if(mode==='story')nextMission();else if(mode==='race')setup('race');else if(mode==='workshop')setup('workshop');else if(mode==='explore')setup('explore');else nextMission();}

function setup(type,title){items=[];guards=[];racePath=[];puzzle=null;lastSpot=0;footprints=[];player.x=0;player.y=300;player.z=0;player.vz=0;cam.x=player.x;cam.y=player.y;let n=grade<2?4:grade<4?7:grade<6?9:11;let m={type,title:title||'',count:0,total:n,elapsed:0,penalty:0,complete:false,delay:0,desc:'',cargo:0};mission=m;
