const grades=['Pre-K','K','1st','2nd','3rd','4th','5th'];const modes=[['quick','Quick Play','10-minute rotating missions'],['story','Story Adventure','Journey from mischief to kindness'],['explore','Explore Whoville','Discover secrets at your own pace'],['race','Sleigh Racing','Race through snowy checkpoints'],['workshop','Christmas Workshop','Toy and pattern challenges']];
let grade=2,mode='quick',character='grinch',prefs={minutes:10,music:false,effects:true,voice:false,assist:true,reset:true},best=0,save=null;try{Object.assign(prefs,JSON.parse(localStorage.getItem('grinch-prefs')||'{}'));best=+localStorage.getItem('grinch-best')||0;save=JSON.parse(localStorage.getItem('grinch-save')||'null')}catch(e){}

const player={x:0,y:100,z:0,vz:0,dir:1,moving:false};let session={score:0,hearts:0,seconds:0,missions:0,index:0},mission=null,items=[],particles=[],guards=[],racePath=[],lastSpot=0,puzzle=null;
const homes=[[-420,-110,'#d65f61'],[-230,-160,'#c19a4e'],[210,-155,'#5b9aa2'],[425,-95,'#9875b4'],[-430,135,'#71975e'],[-220,190,'#b86b48'],[220,180,'#b16b83'],[430,130,'#568fa5'],[-330,380,'#8c78b8'],[330,380,'#d27b59']].map((h,i)=>({x:h[0],y:h[1],color:h[2],name:['Peppermint','Gingerbread','Snowflake','Twinkle','Holly','Cocoa','Jingle','Frost','Candy','Star'][i],id:i}));
const trees=[];for(let i=0;i<65;i++){let a=i*2.399,x=Math.cos(a)*(570+(i%5)*36),y=Math.sin(a)*(470+(i%7)*26);if(y< -420&&Math.abs(x)<250)continue;trees.push({x,y,h:45+(i*17)%55})}const snow=Array.from({length:95},()=>({x:Math.random(),y:Math.random(),r:rnd(.7,2.1),v:rnd(.035,.13)}));
const story=[['supplies','Inside Mount Crumpit'],['workshop','Build the Sleigh'],['race','Mountain Madness'],['collect','Welcome to Whoville'],['stealth','Silent Night'],['stealth','The Christmas Mischief'],['race','Runaway Sleigh'],['rescue','Trouble on Mount Crumpit'],['kindness','Three Sizes Bigger'],['deliver','Operation Save Christmas'],['decorate','Christmas Celebration'],['kindness','The Christmas Feast']];const quick=['collect','deliver','race','kindness','rescue','decorate','stealth','workshop'];
function settingsHTML(){return `<div class="setting"><span>Library session length</span><select id="mins">${[5,10,15,20,30,0].map(n=>`<option value="${n}" ${prefs.minutes===n?'selected':''}>${n?n+' minutes':'Unlimited'}</option>`).join('')}</select></div>${[['music','Original background music'],['effects','Sound effects'],['voice','Spoken instructions'],['assist','Navigation assistance'],['reset','Return to menu after quick play']].map(([k,l])=>`<label class="setting">${l}<input type="checkbox" id="pref-${k}" ${prefs[k]?'checked':''}></label>`).join('')}`}
function menu(){state='menu';stopMusic();$('hud').classList.remove('show');$('overlay').classList.remove('hide');$('panel').innerHTML=`<div class="eyebrow">Gilbert Elementary • Media Center</div><h1 class="title">THE GRINCH</h1><div class="subtitle">Operation Save Christmas</div><p class="lead">Explore snowy Whoville, race a runaway sleigh, rescue presents and discover the power of a generous heart.</p><div class="label">Choose your grade</div><div class="choice">${grades.map((g,i)=>`<button data-grade="${i}" class="${grade===i?'selected':''}">${g}</button>`).join('')}</div><div class="label">Choose your adventure</div><div class="modes">${modes.map(([v,t,d])=>`<button data-mode="${v}" class="${mode===v?'selected':''}">${t}<small>${d}</small></button>`).join('')}</div><div class="label">Choose your character</div><div class="choice">${[['grinch','Grinch'],['max','Max'],['cindy','Cindy Lou']].map(([v,t])=>`<button data-char="${v}" class="${character===v?'selected':''}">${t}</button>`).join('')}</div><div class="footer"><button class="primary" id="play">Start adventure ▶</button>${save?'<button id="resumeStory">Continue story</button>':''}<button id="teacher">⚙ Teacher settings</button><button id="full">⛶ Full screen</button></div><p class="note">No account needed • Best score: ${best} • Unofficial book companion with original vector artwork and synthesized audio. Not affiliated with the rights holders. For classroom evaluation; obtain appropriate permissions before public distribution.</p>`;
$('panel').querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{grade=+b.dataset.grade;menu()});$('panel').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;menu()});$('panel').querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{character=b.dataset.char;menu()});$('play').onclick=()=>start(false);if($('resumeStory'))$('resumeStory').onclick=()=>start(true);$('teacher').onclick=()=>settings(false);$('full').onclick=full;}
function settings(inGame){state=inGame?'pause':'settings';stopMusic();$('overlay').classList.remove('hide');$('panel').innerHTML=`<div class="eyebrow">Media center controls</div><h2 class="big">Teacher settings</h2>${settingsHTML()}<p class="note">Settings are stored only on this device. Sound is off by default for quiet library play. Younger players receive extra visual guidance.</p><div class="footer"><button class="primary" id="apply">Save settings</button><button id="back">Back</button></div>`;$('apply').onclick=()=>{prefs.minutes=+$('mins').value;for(let k of ['music','effects','voice','assist','reset'])prefs[k]=$('pref-'+k).checked;store('grinch-prefs',prefs);inGame?pause():menu()};$('back').onclick=()=>inGame?pause():menu()}
function full(){let el=document.documentElement;try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});else toast('On iPad, use Safari Add to Home Screen for a larger view.')}catch(e){}}
function tone(f,d=.12,vol=.045,type='sine'){if(!audio)return;try{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d)}catch(e){}}
function unlockAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}function sfx(good=true){if(prefs.effects){tone(good?660:190,.14);if(good)setTimeout(()=>tone(880,.18),75)}}function stopMusic(){clearInterval(musicTimer);musicTimer=null}function startMusic(){stopMusic();if(!prefs.music)return;unlockAudio();const notes=[392,440,523,440,349,392,330,392,440,587,523,440,392,330,349,294];musicTimer=setInterval(()=>{tone(notes[musicIdx++%notes.length],.48,.023,'triangle');if(musicIdx%4===0)tone(196,.8,.014)},390)}function say(s){if(prefs.voice&&'speechSynthesis'in window){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.rate=.88;speechSynthesis.speak(u)}catch(e){}}}
function start(continuing){unlockAudio();session={score:0,hearts:0,seconds:0,missions:0,index:0};if(continuing&&save){mode='story';grade=save.grade;character=save.character;session={...session,...save.session};}state='play';$('overlay').classList.add('hide');$('hud').classList.add('show');startMusic();if(mode==='story')nextMission();else if(mode==='race')setup('race');else if(mode==='workshop')setup('workshop');else if(mode==='explore')setup('explore');else nextMission();}
function saveStory(){if(mode==='story'){save={grade,character,session:{...session}};store('grinch-save',save)}}
function nextMission(){if(mode==='story'){if(session.index>=story.length){save=null;store('grinch-save',null);return finish('Christmas is saved!')}setup(...story[session.index]);}else{let pool=quick.filter(t=>grade>1||t!=='stealth');setup(pool[(session.index+Math.floor(session.index/3))%pool.length]);}}
function place(kind,x,y,extra={}){items.push({kind,x,y,done:false,phase:rnd(0,TAU),...extra})}function randomSpot(){for(let i=0;i<100;i++){let p={x:rnd(-510,510),y:rnd(-290,430)};if(!homes.some(h=>Math.abs(p.x-h.x)<95&&Math.abs(p.y-h.y)<75)&&Math.hypot(p.x,p.y)>65)return p}return {x:0,y:260}}
function setup(type,title){items=[];guards=[];racePath=[];puzzle=null;lastSpot=0;player.x=0;player.y=300;player.z=0;player.vz=0;cam.x=player.x;cam.y=player.y;let n=grade<2?4:grade<4?7:grade<6?9:11;let m={type,title:title||'',count:0,total:n,elapsed:0,penalty:0,complete:false,delay:0,desc:'',cargo:0};mission=m;
let names={supplies:'Inside Mount Crumpit',workshop:'Christmas Workshop',race:'Mountain Madness',collect:'Lost Christmas Treasures',stealth:'Silent Night',rescue:'Snowstorm Rescue',kindness:'A Change of Heart',deliver:'Operation Save Christmas',decorate:'Light Up Whoville',explore:'Explore Whoville'};m.title=m.title||names[type];
if(type==='supplies'){player.y=-640;cam.y=player.y;for(let i=0;i<n;i++)place('gear',rnd(-230,230),rnd(-790,-490));m.desc='Find the glowing workshop supplies.'}
else if(type==='race'){player.y=-740;cam.y=player.y;let count=grade<2?6:grade<4?9:12;for(let i=0;i<count;i++){let y=-650+i*106,x=Math.sin(i*1.17)* (grade<2?90:grade<4?175:260);racePath.push({x,y});place('ring',x,y,{order:i})}m.total=count;m.desc='Follow the numbered golden gates in order. Jump over snowbanks!';for(let i=0;i<count-1;i++){let p=racePath[i];place('snowbank',p.x+((i%2)?1:-1)*55,p.y+42)} }
else if(type==='deliver'){m.total=Math.min(n,homes.length);let shuffled=[...homes].sort(()=>Math.random()-.5).slice(0,m.total);shuffled.forEach((h,i)=>{let p=randomSpot();place('parcel',p.x,p.y,{target:h.id,color:h.color});place('door',h.x,h.y+63,{target:h.id,color:h.color})});m.desc='Pick up a present, then bring it to the matching highlighted house.'}
else if(type==='kindness'){m.total=Math.min(n,homes.length);[...homes].sort(()=>Math.random()-.5).slice(0,m.total).forEach(h=>place('friend',h.x,h.y+70,{target:h.id}));m.desc='Find neighbors and press ACTION to share kindness.'}
else if(type==='decorate'){m.total=Math.min(n,homes.length);[...homes].sort(()=>Math.random()-.5).slice(0,m.total).forEach(h=>place('light',h.x,h.y+69,{target:h.id}));m.desc='Visit each dark house and press ACTION to light it up.'}
else if(type==='workshop'){m.total=grade<2?5:grade<4?8:12;m.desc='Match toys, patterns and shapes in the workshop.';player.y=-620;cam.y=player.y;place('bench',0,-600);}
else {for(let i=0;i<n;i++){let p=randomSpot();place(type==='rescue'?'gift':type==='stealth'?'ornament':type==='explore'?'star':'gift',p.x,p.y)}m.desc=type==='stealth'?'Collect decorations. Stay outside the moving lantern circles.':type==='rescue'?'Rescue presents scattered in the snow.':type==='explore'?'Discover hidden stars and explore. Collect them all for a new hunt.':'Find and collect the glowing Christmas treasures.';if(type==='stealth')for(let i=0;i<(grade<2?1:grade<4?2:4);i++)guards.push({x:0,y:0,cx:(i%2?1:-1)*(110+i*85),cy:-130+i*135,a:i*1.7,r:grade<4?58:78});}
if(mode==='story')saveStory();toast(m.title);say(m.desc);updateHUD();if(type==='workshop')openPuzzle();}
function updateHUD(){if(!mission)return;let m=mission;$('chapter').textContent=mode==='story'?`Story • Chapter ${session.index+1} of ${story.length}`:modes.find(x=>x[0]===mode)[1];$('mission').textContent=m.title+'  '+m.count+'/'+m.total;$('goal').textContent=m.desc;$('progress').style.width=(100*m.count/m.total)+'%';$('score').textContent='★ '+session.score;$('heart').textContent='♥ '+session.hearts;let limit=mode==='quick'&&prefs.minutes>0?prefs.minutes*60:0,t=Math.max(0,Math.floor(limit?limit-session.seconds:session.seconds));$('clock').textContent=(limit?'':'⏱ ')+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');$('sound').textContent=prefs.music||prefs.effects?'♪':'🔇'}
function toast(s){$('toast').textContent=s;$('toast').classList.add('on');lastToast=now+2.6}function burst(x,y,color='#ffdf81'){for(let i=0;i<16;i++)particles.push({x,y,z:20,vx:rnd(-65,65),vy:rnd(-65,65),vz:rnd(18,100),life:rnd(.35,.8),color})}
function gain(o,points=100,heart=0){o.done=true;mission.count++;session.score+=points;session.hearts+=heart;burst(o.x,o.y,heart?'#ef94ae':'#ffe19a');sfx();if(mission.count>=mission.total)complete();else toast(`${mission.count} of ${mission.total} • Great work!`);updateHUD()}
function complete(){if(mission.complete)return;mission.complete=true;mission.delay=2.2;session.missions++;session.score+=200;session.hearts+=1;toast('Mission complete! +200 ★');say('Mission complete. Great work!');if(mode==='story'){session.index++;saveStory()}else session.index++;updateHUD()}
function finish(title){state='end';stopMusic();$('overlay').classList.remove('hide');$('hud').classList.remove('show');if(session.score>best){best=session.score;store('grinch-best',best)}$('panel').innerHTML=`<div class="eyebrow">Christmas adventure complete</div><h2 class="big">${esc(title)}</h2><p class="lead">Christmas is about kindness, friendship and helping others. You made Whoville brighter!</p><div class="result"><div><strong>${session.score}</strong>Stars</div><div><strong>${session.hearts}</strong>Kindness hearts</div><div><strong>${session.missions}</strong>Missions</div></div><div class="footer"><button id="again" class="primary">Play again</button><button id="home">Main menu</button></div>`;$('again').onclick=()=>start(false);$('home').onclick=menu}
function pause(){if(state==='end'||state==='menu')return;state='pause';stopMusic();keys={};joy={x:0,y:0};$('overlay').classList.remove('hide');$('panel').innerHTML=`<div class="eyebrow">Adventure paused</div><h2 class="big">Take a Christmas break</h2><div class="footer"><button class="primary" id="continue">Continue</button><button id="psettings">Teacher settings</button><button id="pfull">Full screen</button><button id="quit">End session</button></div>`;$('continue').onclick=()=>{state='play';$('overlay').classList.add('hide');startMusic();if(mission.type==='workshop'&&!mission.complete)openPuzzle()};$('psettings').onclick=()=>settings(true);$('pfull').onclick=full;$('quit').onclick=()=>{saveStory();menu()}}
function openPuzzle(){if(mission.complete)return;state='puzzle';$('overlay').classList.remove('hide');let symbols=['🎁','🧸','⭐','🚂','🔔','🎄','🧦','❄️'],a=pick(symbols),b=pick(symbols.filter(x=>x!==a)),c=pick(symbols.filter(x=>x!==a&&x!==b));let sequence=grade<2?[a]:grade<4?[a,b,a,b]:grade<6?[a,b,c,a,b]:[a,a,b,c,a,a,b];let answer=grade<2?a:grade<4?a:c;let opts=[...new Set([answer,...symbols.sort(()=>Math.random()-.5)])].slice(0,grade<2?3:6).sort(()=>Math.random()-.5);puzzle={answer};$('panel').innerHTML=`<div class="eyebrow">Workshop • ${mission.count+1} / ${mission.total}</div><h2 class="big">${grade<2?'Find the matching toy!':'What comes next?'}</h2><div style="font-size:clamp(26px,6vw,54px);letter-spacing:4px;padding:12px 0">${sequence.join(' ')} ${grade<2?'':'?'}</div><div class="puzzle">${opts.map((x,i)=>`<button data-opt="${i}" aria-label="Toy ${i+1}">${x}</button>`).join('')}</div><div id="feedback" role="status">Choose the correct toy.</div><div class="footer"><button id="ppause">Pause</button></div>`;let locked=false;$('panel').querySelectorAll('[data-opt]').forEach(el=>el.onclick=()=>{if(locked)return;if(opts[+el.dataset.opt]===answer){locked=true;gain({x:player.x,y:player.y},100,1);$('feedback').textContent='Correct!';el.style.background='#478746';setTimeout(()=>{if(state!=='puzzle')return;if(mission.complete){state='play';$('overlay').classList.add('hide')}else openPuzzle()},650)}else{$('feedback').textContent='Try another toy!';sfx(false);el.disabled=true}});$('ppause').onclick=pause;}
function target(){if(!mission)return null;let m=mission;if(m.type==='race')return items.find(o=>o.kind==='ring'&&o.order===m.count&&!o.done);if(m.type==='deliver'){if(m.cargo!==0)return items.find(o=>o.kind==='door'&&!o.done&&o.target===m.cargo-1);return items.filter(o=>o.kind==='parcel'&&!o.done).sort((a,b)=>dist(a,player)-dist(b,player))[0]}return items.filter(o=>!o.done&&o.kind!=='snowbank').sort((a,b)=>dist(a,player)-dist(b,player))[0]}
function action(){if(state!=='play'||mission.complete)return;let o=target();if(o&&dist(o,player)<(grade<2?95:67)){if(o.kind==='friend')gain(o,150,2);else if(o.kind==='light')gain(o,120,1);else if(o.kind==='door'&&mission.cargo===o.target+1){mission.cargo=0;gain(o,170,1);mission.desc='Find another present and deliver it to its matching house.'}else if(o.kind==='bench')openPuzzle();else if(o.kind==='parcel')pickup(o);else if(o.kind!=='ring')gain(o)}else toast('Move closer to the glowing target.');}
function pickup(o){if(mission.cargo)return;o.done=true;mission.cargo=o.target+1;mission.desc='Deliver to '+homes[o.target].name+' house! Follow the golden arrow.';burst(o.x,o.y);sfx();toast('Present picked up!');updateHUD()}
function jump(){if(state==='play'&&player.z<=.1){player.vz=240;sfx(false)}}
function tick(dt){if(state==='puzzle'){session.seconds+=dt;if(mode==='quick'&&prefs.minutes&&session.seconds>=prefs.minutes*60)finish('Library mission complete!');return}if(state!=='play')return;session.seconds+=dt;let m=mission;m.elapsed+=dt;if(mode==='quick'&&prefs.minutes&&session.seconds>=prefs.minutes*60){if(prefs.reset){finish('Library time is up!');return}else{finish('Library mission complete!');return}}
let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y;let mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag}player.moving=mag>.08;if(dx!==0)player.dir=dx<0?-1:1;let speed=m.type==='race'?245:character==='max'?194:170; if(grade<2)speed*=.88;if(m.complete)speed*=.7;
let nx=clamp(player.x+dx*speed*dt,-690,690),ny=clamp(player.y+dy*speed*dt,-850,620);let blocked=(x,y)=>m.type!=='race'&&homes.some(h=>Math.abs(x-h.x)<62&&Math.abs(y-h.y)<43);if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;player.z=Math.max(0,player.z+player.vz*dt);player.vz-=600*dt;if(player.z===0)player.vz=0;cam.x+=(player.x-cam.x)*Math.min(1,dt*7);cam.y+=(player.y-cam.y)*Math.min(1,dt*7);
if(!m.complete){for(let g of guards){g.a+=dt*(grade<4?.7:1.0);g.x=g.cx+Math.cos(g.a)*115;g.y=g.cy+Math.sin(g.a)*70;if(dist(g,player)<g.r&&player.z<12&&now-lastSpot>2.4){lastSpot=now;session.score=Math.max(0,session.score-30);toast('Lantern spotted you! Try another path.');sfx(false);player.x=clamp(player.x+(player.x-g.x)*.35,-650,650)}}
for(let o of items){if(o.done)continue;let d=dist(o,player),r=grade<2?44:30;if(o.kind==='snowbank'){if(d<32&&player.z<14&&now-lastSpot>1.5){lastSpot=now;session.score=Math.max(0,session.score-20);toast('Snowbank! Jump to clear it.');sfx(false)}continue}if(d>r)continue;if(o.kind==='ring'){if(o.order===m.count)gain(o,120);continue}if(o.kind==='parcel'){pickup(o);continue}if(o.kind==='door'){if(m.cargo===o.target+1&&(grade<2||prefs.assist)){m.cargo=0;gain(o,170,1)}continue}if(o.kind==='friend'||o.kind==='light'){if(grade<2&&prefs.assist)gain(o,120,1);continue}if(o.kind==='bench')continue;gain(o,100);if(m.complete)break}}
if(m.complete){m.delay-=dt;if(m.delay<=0){if(mode==='race')setup('race');else if(mode==='workshop')setup('workshop');else if(mode==='explore')setup('explore');else nextMission()}}updateHUD()}
