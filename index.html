let footprints=[],lastFoot=0;function frame(ms){now=ms/1000;let dt=prev?Math.min(.20,Math.max(0,now-prev)):0;prev=now;let remain=dt;while(remain>0){let step=Math.min(.025,remain);tick(step);remain-=step}if(state==='play'&&!sceneRun&&mission?.type!=='race'&&player.moving&&player.z===0&&now-lastFoot>.15){lastFoot=now;footprints.push({x:player.x,y:player.y,a:Math.atan2(joy.y,joy.x||player.dir)+Math.PI/2,life:8});if(footprints.length>65)footprints.shift()}for(let ft of footprints)ft.life-=dt;footprints=footprints.filter(ft=>ft.life>0);for(let s of snow){s.y=(s.y+s.v*dt)%1;s.x=(s.x+dt*.012)%1}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=200*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(now>lastToast)$('toast').classList.remove('on');render();requestAnimationFrame(frame)}
