function arcTone(n){try{if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=[261.63,293.66,329.63,349.23,392,440,493.88,523.25][n];g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.28);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.3)}catch(e){}}

function arcadeTap(x,y){let r=arcade;if(!r||r.ended)return;

function arcadeTick(dt){let r=arcade;if(state!=='arcade'||!r||r.ended)return;if(!['chimney','max','escape','snowball','delivery','hide'].includes(r.kind))return;r.time+=dt;
